
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – Präsentation</title>
  <link rel="stylesheet" href="style.css">
  <style>
   body {
  background: linear-gradient(135deg, #fff9ed, #f3e4c9);
  color: #49391f;
  font-family: system-ui, sans-serif;
}
    .presentation {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
    }
    .presentation h1 {
      font-size: clamp(36px, 5vw, 72px);
    }
    .presentation h2 {
      font-size: clamp(30px, 4vw, 60px);
    }
    .presentation p,
    .presentation li {
      font-size: clamp(22px, 2.5vw, 36px);
    }
    #qr {
      display: inline-block;
      background: white;
      padding: 14px;
      margin: 20px;
    }
    #qr img {
      display: block;
    }
    #options {
      list-style: none;
      padding: 0;
    }
    #options li {
      margin: 16px auto;
      padding: 16px;
      border: 2px solid #64748b;
      border-radius: 12px;
      max-width: 900px;
    }
    #options li.correct {
      background: #166534;
      border-color: #4ade80;
    }
  #leaderboard {
  display: inline-block;
  text-align: left;
  width: 90%;
  max-width: 1300px;
  font-size: clamp(46px, 6vw, 76px);
  font-weight: 600;
  line-height: 1.6;
  padding-left: 90px;
}

#leaderboard li {
  margin-bottom: 25px;
  padding-left: 15px;
}
    .hidden {
      display: none !important;
    }
    .qr-corner {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: white;
      padding: 8px;
      border-radius: 8px;
    }
    .qr-corner img {
      display: block;
      width: 120px;
      height: 120px;
    }
    .title-photo {
  display: block;
  width: 100%;
  max-width: 650px;
  max-height: 420px;
  object-fit: cover;
  margin: 25px auto;
  border-radius: 24px;
  border: 5px solid white;
  box-shadow: 0 12px 35px #0004;
}
  .welcome-poster {
  display: block;
  width: 100%;
  max-width: 1500px;
  max-height: calc(100vh - 40px);
  height: auto;
  object-fit: contain;
  margin: 0 auto;
}

    .presentation .question-art {
      width: clamp(130px, 17vw, 190px);
      min-height: clamp(130px, 17vw, 190px);
      margin: 12px auto 22px;
      border-radius: 38px;
    }
    .presentation .question-art-icon {
      font-size: clamp(64px, 8vw, 104px);
    }
    .presentation .bicycle-helmet { width: clamp(100px, 12vw, 150px); height: auto; }
    .presentation .question-art-caption {
      max-width: 240px;
      font-size: clamp(12px, 1.2vw, 16px);
    }
    .presentation #questionText {
      max-width: 1200px;
      margin: 10px auto 24px;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <main class="presentation">
 <section id="welcome">
  <img
    src="geburtstagsquiz.png"
    alt="Geburtstagsquiz mit Jürgen und seiner Frau"
    class="welcome-poster">
  <div id="qr"></div>
</section>

    <section id="game" class="hidden">
      <p id="questionNumber"></p>
      <div id="questionArt" class="question-art" aria-hidden="true"></div>
      <h1 id="questionText"></h1>
      <ul id="options"></ul>
      <h2 id="answerMessage"></h2>
      <div id="ranking" class="hidden">
        <h2>Aktueller Punktestand</h2>
        <ol id="leaderboard"></ol>
      </div>
    </section>
  </main>

  <div id="qrCorner" class="qr-corner hidden"></div>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="presentation.js?v=helmet3"></script>
</body>
</html>
